# Push a tag (vX.Y.Z) to publish a release of the Cyclorama Dawn brand kit.
name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check the version is in CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "^## ${v} " CHANGELOG.md || { echo "CHANGELOG.md has no '## ${v} ' section"; exit 1; }
          awk -v v="$v" '$0 ~ "^## "v" " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
      - name: Check committed SVGs match the generators
        run: |
          pip install fonttools brotli resvg-py pillow
          python tools/make-marks.py
          python tools/make-icons.py
          python tools/make-avatar.py
          python tools/make-org-art.py
          python tools/make-cover.py docs/assets/cover.toml
          python tools/make-tokens.py
          python tools/verify-brand.py
          git diff --exit-code -- '*.svg' 'brand/tokens/*' || { echo "re-run the tools and commit their output"; exit 1; }
      - name: Build the kit
        run: |
          git archive --format=zip --prefix="rfs-brand-${GITHUB_REF_NAME}/" -o rfs-brand.zip "$GITHUB_REF_NAME"
          cp brand/tokens/rfs.css brand/tokens/rfs-components.css brand/tokens/rfs.tokens.json brand/tokens/rfs.dtcg.json brand/tokens/rfs-tailwind.css brand/tokens/rfs-tokens.ts brand/icons/rfs-icons.svg brand/BRAND-RULES.md .
          unzip -l rfs-brand.zip | tail -1
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md \
            rfs-brand.zip rfs.css rfs-components.css rfs.tokens.json rfs.dtcg.json rfs-tailwind.css rfs-tokens.ts rfs-icons.svg BRAND-RULES.md
