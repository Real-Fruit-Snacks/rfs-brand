# Cover + social preview for this repo. Lives at docs/assets/cover.toml.
# Render (from the folder holding both clones):
#   python3 rfs-brand/tools/make-cover.py <repo>/docs/assets/cover.toml
# Preview at 1200, 830, and 400 px in both themes:
#   python3 rfs-brand/tools/make-cover.py <repo>/docs/assets/cover.toml --preview preview.png

name        = "repo-name"
description = "What it does, for whom"   # README line 1, no trailing period

# Terminal/status prefixes: "$ " Beacon prompt, "ok " Mint, "! " Amber, "x " Raspberry.
# 1. flow: input -> tool -> output
[panel]
kind   = "flow"
status = ["ok what happened, in the tool's own words"]

[panel.input]
label = "Source"
note  = "what it is"
value = "48213"                # use either value = "..." OR chips = ["a", "b", "c"] (1-3 items)
tone  = "steel-ink"            # text | mute | steel-ink | beacon-ink | amber | mint | fault

[panel.tool]
label = "repo-name"
note  = "every 15 s"

[panel.output]
label = "Destination"
note  = "what it is"
value = "48213"                # or chips = ["H.264 8-bit", "720p", "AAC"]
tone  = "mint"

